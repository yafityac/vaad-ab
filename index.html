 HTML
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מערכת התחשבנות - חניון משותף</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4 md:p-8">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [expenses, setExpenses] = useState(() => {
        const saved = localStorage.getItem('vaad_expenses');
        return saved ? JSON.parse(saved) : [];
      });

      const [evRefunds, setEvRefunds] = useState(() => {
        const saved = localStorage.getItem('vaad_ev');
        return saved ? JSON.parse(saved) : [];
      });

      // שדות טופס הוצאה
      const [editingId, setEditingId] = useState(null);
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [desc, setDesc] = useState('');
      const [payee, setPayee] = useState('חברת חשמל');
      const [amount, setAmount] = useState('');
      const [building, setBuilding] = useState('A');
      const [cat, setCat] = useState('חשמל חניון');
      const [notes, setNotes] = useState('');

      // שדות טופס החזר EV
      const [editingEvId, setEditingEvId] = useState(null);
      const [evDate, setEvDate] = useState(new Date().toISOString().split('T')[0]);
      const [tenant, setTenant] = useState('');
      const [evBuilding, setEvBuilding] = useState('A');
      const [evAmount, setEvAmount] = useState('');
      const [evNotes, setEvNotes] = useState('');

      // הגדרות חיפוש
      const [expSearchQuery, setExpSearchQuery] = useState('');
      const [evSearchQuery, setEvSearchQuery] = useState('');

      // הגדרות מיון
      const [expSortBy, setExpSortBy] = useState('cat');
      const [expSortOrder, setExpSortOrder] = useState('asc');

      const [evSortBy, setEvSortBy] = useState('date');
      const [evSortOrder, setEvSortOrder] = useState('asc');

      useEffect(() => {
        localStorage.setItem('vaad_expenses', JSON.stringify(expenses));
      }, [expenses]);

      useEffect(() => {
        localStorage.setItem('vaad_ev', JSON.stringify(evRefunds));
      }, [evRefunds]);

      const handleCatChange = (e) => {
        const selectedCat = e.target.value;
        setCat(selectedCat);
        if (selectedCat === 'חשמל חניון') {
          setPayee('חברת חשמל');
        } else if (!editingId) {
          setPayee('');
        }
      };

      // הפקת רשימת קטגוריות ייחודיות מתוך ההוצאות הקודמות לצורך הצעות אוטומטיות
      const uniqueCategories = Array.from(new Set(expenses.map(e => e.cat))).filter(Boolean);

      // --- חישובי מאזן מדויקים ---
      const totalA = expenses.filter(e => e.building === 'A').reduce((sum, e) => sum + e.amount, 0);
      const totalB = expenses.filter(e => e.building === 'B').reduce((sum, e) => sum + e.amount, 0);

      const evA = evRefunds.filter(r => (r.building || 'A') === 'A').reduce((sum, r) => sum + r.amount, 0);
      const evB = evRefunds.filter(r => r.building === 'B').reduce((sum, r) => sum + r.amount, 0);

      const netA = totalA - evA;
      const netB = totalB - evB;

      const totalJoint = netA + netB;
      const fairShare = totalJoint / 2;
      const debtBtoA = fairShare - netB;

      // פונקציית עזר לנרמול מחרוזות לחיפוש
      const normalizeText = (text) => {
        if (!text && text !== 0) return '';
        return text.toString().replace(/,/g, '').toLowerCase().trim();
      };

      // שמירת הוצאה
      const handleSubmitExpense = (e) => {
        e.preventDefault();
        if (!desc || !amount || !cat) return;

        if (editingId) {
          setExpenses(expenses.map(item => item.id === editingId ? {
            ...item, date, desc, payee, amount: parseFloat(amount), building, cat, notes
          } : item));
          setEditingId(null);
        } else {
          setExpenses([...expenses, {
            id: Date.now(),
            date,
            desc,
            payee: payee || (cat === 'חשמל חניון' ? 'חברת חשמל' : ''),
            amount: parseFloat(amount),
            building,
            cat,
            notes
          }]);
        }

        setDesc('');
        setPayee('חברת חשמל');
        setAmount('');
        setNotes('');
        setCat('חשמל חניון');
        setDate(new Date().toISOString().split('T')[0]);
      };

      const startEdit = (item) => {
        setEditingId(item.id);
        setDate(item.date);
        setCat(item.cat);
        setDesc(item.desc);
        setPayee(item.payee || '');
        setAmount(item.amount);
        setBuilding(item.building);
        setNotes(item.notes || '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const cancelEdit = () => {
        setEditingId(null);
        setDesc('');
        setPayee('חברת חשמל');
        setAmount('');
        setNotes('');
        setCat('חשמל חניון');
        setDate(new Date().toISOString().split('T')[0]);
      };

      // שמירת החזר EV
      const handleSubmitEV = (e) => {
        e.preventDefault();
        if (!tenant || !evAmount) return;

        if (editingEvId) {
          setEvRefunds(evRefunds.map(item => item.id === editingEvId ? {
            ...item, date: evDate, tenant, building: evBuilding, amount: parseFloat(evAmount), notes: evNotes
          } : item));
          setEditingEvId(null);
        } else {
          setEvRefunds([...evRefunds, {
            id: Date.now(),
            date: evDate,
            tenant,
            building: evBuilding,
            amount: parseFloat(evAmount),
            notes: evNotes
          }]);
        }

        setTenant('');
        setEvAmount('');
        setEvNotes('');
        setEvBuilding('A');
        setEvDate(new Date().toISOString().split('T')[0]);
      };

      const startEditEV = (item) => {
        setEditingEvId(item.id);
        setEvDate(item.date);
        setTenant(item.tenant);
        setEvBuilding(item.building || 'A');
        setEvAmount(item.amount);
        setEvNotes(item.notes || '');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const cancelEditEV = () => {
        setEditingEvId(null);
        setTenant('');
        setEvAmount('');
        setEvNotes('');
        setEvBuilding('A');
        setEvDate(new Date().toISOString().split('T')[0]);
      };

      const clearAllData = () => {
        if (window.confirm("האם את בטוחה שתרצי לאפס את כל הנתונים?")) {
          setExpenses([]);
          setEvRefunds([]);
          localStorage.removeItem('vaad_expenses');
          localStorage.removeItem('vaad_ev');
        }
      };

      // סינון ומיון יומן הוצאות
      const filteredExpenses = expenses.filter(e => {
        if (!expSearchQuery) return true;
        const q = normalizeText(expSearchQuery);
        const formattedAmount = e.amount ? e.amount.toLocaleString() : '';
        
        return (
          normalizeText(e.cat).includes(q) ||
          normalizeText(e.date).includes(q) ||
          normalizeText(e.desc).includes(q) ||
          normalizeText(e.payee).includes(q) ||
          normalizeText(e.notes).includes(q) ||
          normalizeText(e.amount).includes(q) ||
          normalizeText(formattedAmount).includes(q)
        );
      });

      const sortedExpenses = [...filteredExpenses].sort((a, b) => {
        let valA = a[expSortBy];
        let valB = b[expSortBy];

        if (expSortBy === 'amount') {
          valA = Number(valA);
          valB = Number(valB);
        } else if (expSortBy === 'date') {
          valA = new Date(valA);
          valB = new Date(valB);
        } else {
          valA = (valA || '').toString();
          valB = (valB || '').toString();
        }

        if (valA < valB) return expSortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return expSortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      // סינון ומיון החזרי EV
      const filteredEvRefunds = evRefunds.filter(r => {
        if (!evSearchQuery) return true;
        const q = normalizeText(evSearchQuery);
        const formattedAmount = r.amount ? r.amount.toLocaleString() : '';
        const buildingName = (r.building || 'A') === 'B' ? "בניין ב'" : "בניין א'";

        const combinedRowText = normalizeText(`
          ${r.date} 
          ${r.tenant} 
          ${r.notes} 
          ${r.building} 
          ${buildingName}
          ${r.amount} 
          ${formattedAmount}
        `);

        return combinedRowText.includes(q);
      });

      const sortedEvRefunds = [...filteredEvRefunds].sort((a, b) => {
        let valA = a[evSortBy];
        let valB = b[evSortBy];

        if (evSortBy === 'amount') {
          valA = Number(valA);
          valB = Number(valB);
        } else if (evSortBy === 'date') {
          valA = new Date(valA);
          valB = new Date(valB);
        } else {
          valA = (valA || '').toString();
          valB = (valB || '').toString();
        }

        if (valA < valB) return evSortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return evSortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      return (
        <div class="max-w-5xl mx-auto space-y-6">
          <header class="bg-blue-900 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
            <div>
              <h1 class="text-2xl font-bold">מערכת התחשבנות חניון - בניין א' ובניין ב'</h1>
              <p class="text-blue-200 text-sm mt-1">ניהול הוצאות, צ'קים וקיזוז רכבים חשמליים</p>
            </div>
            <button onClick={clearAllData} class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-2 rounded font-bold">איפוס נתונים</button>
          </header>

          {/* תמונת מצב */}
          <div class="bg-white p-6 rounded-xl shadow border-r-8 border-blue-600">
            <h2 class="text-xl font-bold text-gray-800 mb-4">תמונת מצב עדכנית</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 text-center">
              <div class="bg-blue-50 p-4 rounded-lg">
                <div class="text-sm text-gray-600">הוצאות בניין א' (נטו מכיסו)</div>
                <div class="text-xl font-bold text-blue-900">₪{netA.toLocaleString()}</div>
                <div class="text-xs text-gray-500">(שילם ₪{totalA} פחות ₪{evA} החזרי EV)</div>
              </div>
              <div class="bg-green-50 p-4 rounded-lg">
                <div class="text-sm text-gray-600">הוצאות בניין ב' (נטו מכיסו)</div>
                <div class="text-xl font-bold text-green-900">₪{netB.toLocaleString()}</div>
                <div class="text-xs text-gray-500">(שילם ₪{totalB} פחות ₪{evB} החזרי EV)</div>
              </div>
              <div class="bg-yellow-50 p-4 rounded-lg">
                <div class="text-sm text-gray-600">חלקו של כל בניין (50% מהנטו המשותף)</div>
                <div class="text-xl font-bold text-yellow-900">₪{fairShare.toLocaleString()}</div>
                <div class="text-xs text-gray-500">(סה"כ הוצאות חניון נטו: ₪{totalJoint.toLocaleString()})</div>
              </div>
            </div>

            {/* שורת הסיכום המרכזית המתוקנת */}
            <div class="bg-blue-900 text-white p-4 rounded-lg text-center font-bold text-lg">
              {debtBtoA > 0 ? (
                <span>בניין ב' חייב לבניין א': ₪{debtBtoA.toLocaleString()}</span>
              ) : debtBtoA < 0 ? (
                <span>בניין א' חייב לבניין ב': ₪{Math.abs(debtBtoA).toLocaleString()}</span>
              ) : (
                <span>החשבון מאוזן לחלוטין!</span>
              )}
            </div>
          </div>

          {/* טפסים */}
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* טופס הוצאה */}
            <form onSubmit={handleSubmitExpense} class={`bg-white p-6 rounded-xl shadow space-y-4 border-2 ${editingId ? 'border-amber-500 bg-amber-50/20' : 'border-transparent'}`}>
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-gray-800">{editingId ? "עריכת הוצאה קיימת" : "הוספת הוצאה חדשה"}</h3>
                {editingId && <button type="button" onClick={cancelEdit} class="text-xs text-gray-500 hover:underline">ביטול עריכה</button>}
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-sm font-medium mb-1">תאריך</label>
                  <input type="date" value={date} onChange={e=>setDate(e.target.value)} class="w-full border p-2 rounded text-sm" required />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">סוג הוצאה (קטגוריה)</label>
                  {/* שדה טקסט עם השלמה אוטומטית (Datalist) מבוסס קטגוריות קודמות */}
                  <input 
                    type="text" 
                    list="categories-list" 
                    value={cat} 
                    onChange={handleCatChange} 
                    class="w-full border p-2 rounded text-sm bg-white" 
                    placeholder="הקלידי או בחרי קטגוריה..." 
                    required 
                  />
                  <datalist id="categories-list">
                    <option value="חשמל חניון" />
                    <option value="תחזוקה" />
                    <option value="ניקיון" />
                    <option value="אבטחה" />
                    {uniqueCategories.map((c, index) => (
                      <option key={index} value={c} />
                    ))}
                  </datalist>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">פירוט ההוצאה (תיאור)</label>
                <input type="text" value={desc} onChange={e=>setDesc(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="למשל: חשבון חשמל חודשים 01-02" required />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-sm font-medium mb-1">למי ניתן הצ'ק / ספק</label>
                  <input type="text" value={payee} onChange={e=>setPayee(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="שם חברה / ספק" />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">סכום (₪)</label>
                  <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="0" required />
                </div>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-sm font-medium mb-1">איזה בניין שילם?</label>
                  <select value={building} onChange={e=>setBuilding(e.target.value)} class="w-full border p-2 rounded text-sm">
                    <option value="A">בניין א'</option>
                    <option value="B">בניין ב'</option>
                  </select>
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">פרטים נוספים / הערות</label>
                  <input type="text" value={notes} onChange={e=>setNotes(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="מס' צ'ק, אסמכתא..." />
                </div>
              </div>
              <button type="submit" class={`w-full text-white py-2 rounded font-bold ${editingId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                {editingId ? "שמור שינויים" : "הוסף הוצאה למאזן"}
              </button>
            </form>

            {/* טופס החזרי EV */}
            <form onSubmit={handleSubmitEV} class={`bg-white p-6 rounded-xl shadow space-y-4 border-2 ${editingEvId ? 'border-amber-500 bg-amber-50/20' : 'border-transparent'}`}>
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-lg text-gray-800">{editingEvId ? "עריכת החזר EV" : "החזר חשמל מרכב חשמלי (EV)"}</h3>
                {editingEvId && <button type="button" onClick={cancelEditEV} class="text-xs text-gray-500 hover:underline">ביטול עריכה</button>}
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-sm font-medium mb-1">תאריך ההחזר</label>
                  <input type="date" value={evDate} onChange={e=>setEvDate(e.target.value)} class="w-full border p-2 rounded text-sm" required />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">איזה בניין גבה?</label>
                  <select value={evBuilding} onChange={e=>setEvBuilding(e.target.value)} class="w-full border p-2 rounded text-sm">
                    <option value="A">בניין א'</option>
                    <option value="B">בניין ב'</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium mb-1">שם הדייר / דירה</label>
                <input type="text" value={tenant} onChange={e=>setTenant(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="למשל: ישראל ישראלי (דירה 12)" required />
              </div>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-sm font-medium mb-1">סכום שהוחזר (₪)</label>
                  <input type="number" value={evAmount} onChange={e=>setEvAmount(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="0" required />
                </div>
                <div>
                  <label class="block text-sm font-medium mb-1">הערות להחזר</label>
                  <input type="text" value={evNotes} onChange={e=>setEvNotes(e.target.value)} class="w-full border p-2 rounded text-sm" placeholder="ביט, העברה..." />
                </div>
              </div>
              <button type="submit" class={`w-full text-white py-2 rounded font-bold mt-2 ${editingEvId ? 'bg-amber-600 hover:bg-amber-700' : 'bg-green-600 hover:bg-green-700'}`}>
                {editingEvId ? "שמור שינויי החזר EV" : "רשום החזר EV"}
              </button>
            </form>
          </div>

          {/* טבלאות נתונים */}
          <div class="bg-white p-6 rounded-xl shadow space-y-6">
            
            {/* יומן הוצאות */}
            <div>
              <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-blue-50 p-3 rounded-lg border border-blue-100 mb-3 gap-3 text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-blue-900 font-bold whitespace-nowrap">מיון הוצאות:</span>
                  <select value={expSortBy} onChange={e=>setExpSortBy(e.target.value)} class="border bg-white p-1.5 rounded">
                    <option value="cat">סוג הוצאה</option>
                    <option value="date">תאריך</option>
                    <option value="amount">סכום</option>
                    <option value="building">בניין משלם</option>
                    <option value="payee">ספק / צ'ק</option>
                  </select>
                  <select value={expSortOrder} onChange={e=>setExpSortOrder(e.target.value)} class="border bg-white p-1.5 rounded">
                    <option value="asc">עולה (א-ת / ישן לחדש)</option>
                    <option value="desc">יורד (ת-א / חדש לישן)</option>
                  </select>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto">
                  <span class="text-blue-900 font-bold whitespace-nowrap">חיפוש:</span>
                  <input 
                    type="text" 
                    value={expSearchQuery} 
                    onChange={e => setExpSearchQuery(e.target.value)} 
                    placeholder="חפשי סכום (למשל 1656), תיאור..." 
                    class="border bg-white p-1.5 rounded w-full md:w-64 text-sm" 
                  />
                  {expSearchQuery && (
                    <button onClick={() => setExpSearchQuery('')} class="text-xs text-red-500 font-bold underline">נקה</button>
                  )}
                </div>
              </div>

              <h3 class="font-bold text-lg mb-2 text-gray-800">יומן הוצאות מפורט</h3>
              {sortedExpenses.length === 0 ? (
                <p class="text-gray-500 text-sm italic">לא נמצאו הוצאות תואמות.</p>
              ) : (
                <div class="overflow-x-auto">
                  <table class="w-full text-right border-collapse text-sm">
                    <thead>
                      <tr class="bg-gray-100 border-b text-gray-600">
                        <th class="p-2">סוג הוצאה</th>
                        <th class="p-2">תאריך</th>
                        <th class="p-2">פירוט הוצאה</th>
                        <th class="p-2">למי ניתן צ'ק / ספק</th>
                        <th class="p-2">מי שילם</th>
                        <th class="p-2">סכום</th>
                        <th class="p-2">הערות</th>
                        <th class="p-2">פעולות</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedExpenses.map(e => (
                        <tr key={e.id} class={`border-b ${editingId === e.id ? 'bg-amber-50' : ''}`}>
                          <td class="p-2 font-medium text-blue-900">{e.cat}</td>
                          <td class="p-2">{e.date}</td>
                          <td class="p-2">{e.desc}</td>
                          <td class="p-2">{e.payee || '-'}</td>
                          <td class="p-2 font-bold">{e.building === 'A' ? "בניין א'" : "בניין ב'"}</td>
                          <td class="p-2 font-bold">₪{e.amount.toLocaleString()}</td>
                          <td class="p-2 text-gray-500">{e.notes || '-'}</td>
                          <td class="p-2 space-x-2 space-x-reverse">
                            <button onClick={()=>startEdit(e)} class="text-blue-600 text-xs font-bold hover:underline ml-2">ערוך</button>
                            <button onClick={()=>setExpenses(expenses.filter(x=>x.id!==e.id))} class="text-red-500 text-xs hover:underline">מחק</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

            <hr />

            {/* החזרי EV */}
            <div>
              <div class="flex flex-col md:flex-row justify-between items-start md:items-center bg-green-50 p-3 rounded-lg border border-green-100 mb-3 gap-3 text-sm">
                <div class="flex items-center gap-2">
                  <span class="text-green-900 font-bold whitespace-nowrap">מיון החזרי EV:</span>
                  <select value={evSortBy} onChange={e=>setEvSortBy(e.target.value)} class="border bg-white p-1.5 rounded">
                    <option value="date">תאריך</option>
                    <option value="amount">סכום</option>
                    <option value="tenant">שם דייר</option>
                    <option value="building">בניין גובה</option>
                  </select>
                  <select value={evSortOrder} onChange={e=>setEvSortOrder(e.target.value)} class="border bg-white p-1.5 rounded">
                    <option value="asc">עולה (ישן לחדש / נמוך לגבוה)</option>
                    <option value="desc">יורד (חדש לישן / גבוה לנמוך)</option>
                  </select>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto">
                  <span class="text-green-900 font-bold whitespace-nowrap">חיפוש:</span>
                  <input 
                    type="text" 
                    value={evSearchQuery} 
                    onChange={e => setEvSearchQuery(e.target.value)} 
                    placeholder="חפשי סכום (למשל 1656), שם דייר..." 
                    class="border bg-white p-1.5 rounded w-full md:w-64 text-sm" 
                  />
                  {evSearchQuery && (
                    <button onClick={() => setEvSearchQuery('')} class="text-xs text-red-500 font-bold underline">נקה</button>
                  )}
                </div>
              </div>

              <h3 class="font-bold text-lg mb-2 text-gray-800">היסטוריית החזרי רכבים חשמליים (EV)</h3>
              {sortedEvRefunds.length === 0 ? (
                <p class="text-gray-500 text-sm italic">לא נמצאו החזרי EV תואמות.</p>
              ) : (
                <div class="overflow-x-auto">
                  <table class="w-full text-right border-collapse text-sm">
                    <thead>
                      <tr class="bg-gray-100 border-b text-gray-600">
                        <th class="p-2">תאריך</th>
                        <th class="p-2">שם הדייר / דירה</th>
                        <th class="p-2">בניין שגבה</th>
                        <th class="p-2">סכום</th>
                        <th class="p-2">הערות</th>
                        <th class="p-2">פעולות</th>
                      </tr>
                    </thead>
                    <tbody>
                      {sortedEvRefunds.map(r => (
                        <tr key={r.id} class={`border-b ${editingEvId === r.id ? 'bg-amber-50' : ''}`}>
                          <td class="p-2">{r.date}</td>
                          <td class="p-2">{r.tenant}</td>
                          <td class="p-2 font-bold">{r.building === 'B' ? "בניין ב'" : "בניין א'"}</td>
                          <td class="p-2 font-bold text-green-700">₪{r.amount.toLocaleString()}</td>
                          <td class="p-2 text-gray-500">{r.notes || '-'}</td>
                          <td class="p-2 space-x-2 space-x-reverse">
                            <button onClick={()=>startEditEV(r)} class="text-blue-600 text-xs font-bold hover:underline ml-2">ערוך</button>
                            <button onClick={()=>setEvRefunds(evRefunds.filter(x=>x.id!==r.id))} class="text-red-500 text-xs hover:underline">מחק</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
